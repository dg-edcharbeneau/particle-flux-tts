<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particles Swarm Export</title>
    <style>body { margin: 0; overflow: hidden; background: #000; }</style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // CONFIG
        const COUNT = 20000;
        const SPEED_MULT = 1;
        const AUTO_SPIN = true;

        // SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.01);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 100);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = AUTO_SPIN;
        controls.autoRotateSpeed = 2.0;

        // POST PROCESSING
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.strength = 1.8; bloomPass.radius = 0.4; bloomPass.threshold = 0;
        composer.addPass(bloomPass);

        // SWARM OBJECTS
        const dummy = new THREE.Object3D();
        const color = new THREE.Color();
        const target = new THREE.Vector3();
        const pColor = new THREE.Color(); // Kept for safety, for potential references
        
        // INSTANCED MESH
        const geometry = new THREE.TetrahedronGeometry(0.25);
        const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const instancedMesh = new THREE.InstancedMesh(geometry, material, COUNT);
        instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        scene.add(instancedMesh);

        // DATA ARRAYS
        const positions = [];
        for(let i=0; i<COUNT; i++) {
            positions.push(new THREE.Vector3((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100));
            instancedMesh.setColorAt(i, color.setHex(0x00ff88)); // Init Color
        }

        // CONTROL STUBS
        const PARAMS = {"freq":20,"speed":7.4,"srcDist":18.64,"amp":15,"decay":0.2};
        const addControl = (id, label, min, max, val) => {
            return PARAMS[id] !== undefined ? PARAMS[id] : val;
        };
        const setInfo = () => {};
        const annotate = () => {};

        // ANIMATION LOOP
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = clock.getElapsedTime() * SPEED_MULT;
            
            // Shader Time Update
            if(material.uniforms && material.uniforms.uTime) {
                material.uniforms.uTime.value = time;
            }

            controls.update();

            // SWARM LOGIC
            const count = COUNT; // Alias for user code compatibility
            for(let i=0; i<COUNT; i++) {
                 // USER CODE INJECTION START
                 const freq = addControl("freq", "Wave Frequency", 1, 20, 8);
                 const speed = addControl("speed", "Wave Speed", 0, 10, 4);
                 const srcDist = addControl("srcDist", "Source Distance", 1, 50, 20);
                 const amp = addControl("amp", "Wave Amplitude", 0.1, 15, 6);
                 const decay = addControl("decay", "Attenuation", 0.0, 0.2, 0.03);
                 const gridSize = Math.ceil(Math.sqrt(count));
                 const row = Math.floor(i / gridSize);
                 const col = i % gridSize;
                 const u = (col / gridSize) - 0.5;
                 const v = (row / gridSize) - 0.5;
                 const span = 120.0;
                 const x = u * span;
                 const z = v * span;
                 const s1x = -srcDist * 0.5;
                 const s1z = 0.0;
                 const s2x = srcDist * 0.5;
                 const s2z = 0.0;
                 const dx1 = x - s1x;
                 const dz1 = z - s1z;
                 const d1 = Math.sqrt(dx1 * dx1 + dz1 * dz1);
                 const dx2 = x - s2x;
                 const dz2 = z - s2z;
                 const d2 = Math.sqrt(dx2 * dx2 + dz2 * dz2);
                 const k = freq * 0.2;
                 const phase = time * speed;
                 const att1 = 1.0 / (1.0 + d1 * decay);
                 const att2 = 1.0 / (1.0 + d2 * decay);
                 const wave1 = Math.sin(d1 * k - phase) * att1;
                 const wave2 = Math.sin(d2 * k - phase) * att2;
                 const interference = wave1 + wave2;
                 target.set(x, interference * amp, z);
                 const hue = 0.65 - interference * 0.15;
                 const saturation = 0.7 + Math.abs(interference) * 0.3;
                 const lightness = 0.15 + Math.abs(interference) * 0.4;
                 color.setHSL(
                 hue - Math.floor(hue),
                 Math.min(1.0, Math.max(0.0, saturation)),
                 Math.min(1.0, Math.max(0.0, lightness))
                 );
                 if (i === 0) {
                 setInfo("Wave Optics Interference", "A 3D visualization of dual-source wave interference patterns.");
                 annotate("src1", new THREE.Vector3(s1x, 0, s1z), "Wave Source A");
                 annotate("src2", new THREE.Vector3(s2x, 0, s2z), "Wave Source B");
                 }
                 
                 // USER CODE INJECTION END

                 // LERP & UPDATE
                 positions[i].lerp(target, 0.1);
                 dummy.position.copy(positions[i]);
                 dummy.updateMatrix();
                 instancedMesh.setMatrixAt(i, dummy.matrix);
                 instancedMesh.setColorAt(i, color); // Fix: Use 'color' which user modifies
            }
            instancedMesh.instanceMatrix.needsUpdate = true;
            instancedMesh.instanceColor.needsUpdate = true;

            composer.render();
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
